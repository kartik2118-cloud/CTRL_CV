<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Indic LiveSub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 320px;
      padding: 16px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      font-size: 13px;
      line-height: 1.4;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 700;
      color: #ef4444;
      letter-spacing: -0.2px;
    }
    .logo span.tag {
      font-size: 10px;
      font-weight: 600;
      background: rgba(239, 68, 68, 0.18);
      color: #ef4444;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      background: rgba(148, 163, 184, 0.15);
      color: #94a3b8;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }

    /* Main Toggle Capture Button */
    .btn-capture-wrap {
      margin-bottom: 14px;
    }
    .btn {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      border: none;
      outline: none;
    }
    .btn-primary {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.35);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(239, 68, 68, 0.45);
    }
    .btn-danger {
      background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(220, 38, 38, 0.35);
      animation: pulse-danger 2s infinite;
    }
    @keyframes pulse-danger {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); }
      50% { box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); }
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 11px;
      padding: 7px 10px;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none !important;
    }

    /* Section Boxes */
    .section-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    .section-title {
      font-size: 10px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 8px;
    }
    .form-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .form-group:last-child {
      margin-bottom: 0;
    }
    label {
      font-size: 11px;
      color: #cbd5e1;
      font-weight: 500;
    }
    select, input[type="text"] {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 5px;
      padding: 5px 8px;
      font-size: 11px;
      outline: none;
      font-family: inherit;
    }
    select:focus, input[type="text"]:focus {
      border-color: #ef4444;
    }
    select {
      cursor: pointer;
      max-width: 140px;
    }
    input[type="text"] {
      width: 100%;
      font-family: ui-monospace, monospace;
      font-size: 10px;
    }

    /* Action Grid */
    .actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 12px;
    }

    /* Notice */
    .privacy-box {
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.22);
      border-radius: 6px;
      padding: 7px 9px;
      font-size: 10px;
      color: #fca5a5;
      line-height: 1.35;
    }
    .privacy-box strong {
      color: #fee2e2;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="logo">
      <span>🔴</span> LiveSub
      <span class="tag">AI STT</span>
    </div>
    <div class="status-pill" id="status-pill">
      <span class="status-dot"></span>
      <span id="status-text">Standby</span>
    </div>
  </div>

  <!-- Main Start/Stop Capture Button -->
  <div class="btn-capture-wrap">
    <button id="btn-toggle-capture" class="btn btn-primary">
      <span>▶</span> Start Audio Capture
    </button>
  </div>

  <!-- Video Caption & Subtitle Status Banner -->
  <div id="caption-status-box" style="margin-bottom: 12px; padding: 7px 10px; border-radius: 6px; font-size: 11px; display: flex; align-items: center; gap: 7px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); line-height: 1.35;">
    <span id="caption-status-icon">🔍</span>
    <span id="caption-status-text" style="color: #94a3b8; font-weight: 500;">Detecting captions & subtitles...</span>
  </div>

  <!-- Language Selection -->
  <div class="section-card">
    <div class="section-title">Language Setup</div>
    <div class="form-group">
      <label for="select-source-lang">Spoken Audio</label>
      <select id="select-source-lang">
        <option value="hi" selected>Hindi (हिंदी)</option>
        <option value="mr">Marathi (मराठी)</option>
        <option value="ta">Tamil (தமிழ்)</option>
        <option value="te">Telugu (తెలుగు)</option>
        <option value="en">English</option>
        <option value="auto">Auto-detect</option>
      </select>
    </div>
    <div class="form-group">
      <label for="select-target-lang">Translate To</label>
      <select id="select-target-lang">
        <option value="en" selected>English</option>
        <option value="hi">Hindi (हिंदी)</option>
        <option value="mr">Marathi (मराठी)</option>
        <option value="ta">Tamil (தமிழ்)</option>
        <option value="te">Telugu (తెలుగు)</option>
        <option value="none">None (Single Subtitle)</option>
      </select>
    </div>
  </div>

  <!-- Server Configuration -->
  <div class="section-card">
    <div class="section-title">Streaming Backend</div>
    <input type="text" id="input-ws-url" value="ws://127.0.0.1:8000/ws" spellcheck="false" autocomplete="off">
  </div>

  <!-- Actions -->
  <div class="actions-grid">
    <button id="btn-test-overlay" class="btn btn-secondary">
      <span>✨</span> Demo
    </button>
    <button id="btn-clear-overlay" class="btn btn-secondary">
      <span>✕</span> Clear
    </button>
    <button id="btn-export-log" class="btn btn-secondary">
      <span>📥</span> Cue Log (JSON)
    </button>
    <button id="btn-export-srt" class="btn btn-secondary">
      <span>📄</span> Subtitles (SRT)
    </button>
    <button id="btn-clear-cache" class="btn btn-secondary" style="grid-column: span 2;">
      <span>⚡</span> Clear Script Cache Memory
    </button>
  </div>

  <!-- Cloud Disclosure -->
  <div class="privacy-box">
    <strong>Cloud Audio Notice:</strong> Tab audio is streamed to the local backend & Groq Whisper endpoint for real-time speech recognition.
  </div>

  <script src="popup.js"></script>
</body>
</html>
